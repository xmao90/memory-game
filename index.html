<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B端能力记忆挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-label {
            font-size: 0.9em;
            color: #aaa;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,217,255,0.3);
        }
        .game-area {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .card {
            perspective: 1000px;
            height: 180px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
            font-size: 0.95em;
        }
        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .card-front .label {
            font-size: 0.8em;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }
        .card-front .content {
            font-weight: bold;
            font-size: 1.1em;
        }
        .card-back {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            transform: rotateY(180deg);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .card-back .content {
            color: #1a1a2e;
            font-weight: bold;
            line-height: 1.6;
        }
        .card.matched .card-front {
            background: linear-gradient(135deg, #434343 0%, #000000 100%);
            opacity: 0.5;
        }
        .card.matched .card-back {
            opacity: 0.5;
        }
        .card.wrong .card-inner {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            25% { transform: rotateY(180deg) translateX(-10px); }
            75% { transform: rotateY(180deg) translateX(10px); }
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .mode-btn {
            padding: 8px 20px;
            font-size: 0.9em;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            border: none;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            transition: width 0.3s;
            border-radius: 4px;
        }
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .result-modal.show {
            display: flex;
        }
        .result-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid rgba(0,217,255,0.5);
            max-width: 400px;
        }
        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .result-stats {
            margin: 20px 0;
        }
        .result-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }
        .timer {
            font-size: 1.5em;
            color: #00d9ff;
        }
        .hint {
            font-size: 0.85em;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 B端能力记忆挑战</h1>
            <p class="hint">翻转卡片记忆考核指标，挑战最短时间完成！</p>
        </header>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">⏱️ 用时</div>
                <div class="stat-value" id="timer">00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">✅ 正确</div>
                <div class="stat-value" id="correct">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🎯 进度</div>
                <div class="stat-value" id="progress">0%</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="all">全部记忆</button>
            <button class="mode-btn" data-mode="weight">权重专项</button>
            <button class="mode-btn" data-mode="formula">公式记忆</button>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="startGame()">🎮 开始挑战</button>
            <button class="btn-secondary" onclick="resetGame()">🔄 重置</button>
        </div>

        <div class="game-area" id="gameArea">
            <p style="text-align:center; color:#888; grid-column: 1/-1; padding: 50px;">
                点击「开始挑战」按钮启动记忆游戏
            </p>
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-title" id="resultTitle">🎉 太棒了！</div>
            <div class="result-stats">
                <div class="result-stat">
                    <span>用时</span>
                    <span id="finalTime">00:00</span>
                </div>
                <div class="result-stat">
                    <span>正确率</span>
                    <span id="finalAccuracy">100%</span>
                </div>
                <div class="result-stat">
                    <span>记忆轮次</span>
                    <span id="finalRounds">0</span>
                </div>
            </div>
            <button class="btn-primary" onclick="closeModal(); startGame();">再来一次</button>
            <button class="btn-secondary" onclick="closeModal()" style="margin-left:10px">关闭</button>
        </div>
    </div>

    <script>
        // ==================== 数据配置区 ====================
        // 修改这里的卡片数据来自定义你的记忆内容
        const cardData = [
            { front: "收派车辆升", back: "AER\n指标维度" },
            { front: "定责损坏", back: "TRA\n指标维度" },
            { front: "车辆7件套", back: "指标维度" },
            { front: "入厂", back: "8端综合评价调节项" },
            { front: "主考核项权重 15%", back: "收派车辆升、AER、TRA\n各占15%" },
            { front: "B端综合评价调节项 10%", back: "得分后30%倒扣0.1分" },
            { front: "调节系数范围", back: "【0.6-1.2】\n最低保障0.6" },
            { front: "转型支持组权重", back: "特殊权重\n以转型支持组为准" },
            { front: "失误扣分规则", back: "网点失误1次\n在TB考核项系数上扣0.1" },
            { front: "TOB主考核项系数", back: "(Z涉及指标单项系数×单项权重)/75%×100%" },
            { front: "考核指标数量", back: "9项指标\n含5项核心指标" },
            { front: "调节项得分", back: "见TOB调节项规则\n和B端综合评价调节" }
        ];
        // ==================================================

        let currentMode = 'all';
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let startTime = null;
        let timerInterval = null;
        let isPlaying = false;
        let rounds = 0;
        let wrongAttempts = 0;

        function filterCards(mode) {
            if (mode === 'all') return cardData;
            if (mode === 'weight') {
                return cardData.filter(c => 
                    c.front.includes('%') || c.back.includes('%') || c.front.includes('权重')
                );
            }
            if (mode === 'formula') {
                return cardData.filter(c => 
                    c.front.includes('公式') || c.back.includes('%') || c.front.includes('系数')
                );
            }
            return cardData;
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function createCard(data, index) {
            return `
                <div class="card" data-index="${index}" onclick="flipCard(this)">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="label">考核指标</div>
                            <div class="content">${data.front}</div>
                        </div>
                        <div class="card-back">
                            <div class="content">${data.back}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const area = document.getElementById('gameArea');
            const filteredCards = filterCards(currentMode);
            const cardPairs = [...filteredCards, ...filteredCards];
            cards = shuffle(cardPairs);
            area.innerHTML = cards.map((card, i) => createCard(card, i)).join('');
            totalPairs = filteredCards.length;
            matchedPairs = 0;
            updateStats();
        }

        function flipCard(card) {
            if (!isPlaying || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length >= 2) return;

            card.classList.add('flipped');
            flippedCards.push(card);
            rounds++;

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const idx1 = parseInt(card1.dataset.index);
            const idx2 = parseInt(card2.dataset.index);

            if (cards[idx1].front === cards[idx2].front) {
                // 匹配成功
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    flippedCards = [];

                    if (matchedPairs === totalPairs) {
                        endGame();
                    }
                }, 500);
            } else {
                // 不匹配
                wrongAttempts++;
                card1.classList.add('wrong');
                card2.classList.add('wrong');
                setTimeout(() => {
                    card1.classList.remove('flipped', 'wrong');
                    card2.classList.remove('flipped', 'wrong');
                    flippedCards = [];
                }, 1000);
            }
        }

        function updateStats() {
            document.getElementById('correct').textContent = matchedPairs;
            const progress = totalPairs > 0 ? Math.round((matchedPairs / totalPairs) * 100) : 0;
            document.getElementById('progress').textContent = progress + '%';
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function startGame() {
            isPlaying = true;
            rounds = 0;
            wrongAttempts = 0;
            flippedCards = [];
            renderCards();
            startTimer();
        }

        function resetGame() {
            stopTimer();
            isPlaying = false;
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('correct').textContent = '0';
            document.getElementById('progress').textContent = '0%';
            document.getElementById('progressBar').style.width = '0%';
            renderCards();
        }

        function endGame() {
            stopTimer();
            isPlaying = false;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const secs = (elapsed % 60).toString().padStart(2, '0');
            const accuracy = Math.round((matchedPairs / rounds) * 100);

            document.getElementById('finalTime').textContent = `${mins}:${secs}`;
            document.getElementById('finalAccuracy').textContent = accuracy + '%';
            document.getElementById('finalRounds').textContent = rounds;

            const titles = ['🌟 太棒了！', '🎉 完美通关！', '🏆 高手！', '💯 全对！'];
            document.getElementById('resultTitle').textContent = titles[Math.floor(Math.random() * titles.length)];

            document.getElementById('resultModal').classList.add('show');
            createConfetti();
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('show');
        }

        function createConfetti() {
            const colors = ['#00d9ff', '#00ff88', '#ff6b6b', '#ffd93d', '#6bcb77'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);

                const animation = confetti.animate([
                    { transform: `translateY(-20px) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(100vh) rotate(720deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });

                animation.onfinish = () => confetti.remove();
            }
        }

        // 模式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                if (isPlaying) {
                    resetGame();
                    startGame();
                } else {
                    renderCards();
                }
            });
        });

        // 初始化
        renderCards();
    </script>
</body>
</html>
