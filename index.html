<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆翻翻乐 - TOB指标训练</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --pink: #FF6B9D;
            --teal: #4ECDC4;
            --yellow: #FFE66D;
            --purple: #A06CD5;
            --blue: #74B9FF;
            --orange: #FF9F43;
            --green: #26DE81;
            --red: #FF4757;
            --bg: #F0F4FF;
            --text: #2D3436;
            --muted: #636E72;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            min-height: 100vh;
        }
        .page { display: none; min-height: 100vh; }
        .page.active { display: flex; flex-direction: column; }

        /* ===== 首页 ===== */
        #home {
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 30px;
            background: linear-gradient(135deg, #E8F0FF 0%, #FCE4EC 100%);
            position: relative;
            overflow: hidden;
        }
        #home::before {
            content: '📊🏆💡🎯📈🔧📦🚚📋✅📸🎓⚡📋🔔';
            position: absolute; font-size: 30px; opacity: 0.15;
            white-space: nowrap; top: 20px; left: 0; right: 0;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100vw); }
        }
        .home-title {
            text-align: center;
            position: relative; z-index: 1;
        }
        .home-title h1 {
            font-size: 36px;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .home-title p { color: var(--muted); font-size: 14px; }
        .home-emoji { font-size: 70px; display: block; margin: 15px 0; }
        
        .name-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 100%; max-width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            position: relative; z-index: 1;
        }
        .name-card h3 {
            text-align: center; margin-bottom: 20px;
            color: var(--purple); font-size: 16px;
        }
        .name-card input {
            width: 100%; padding: 16px 20px;
            font-size: 18px; border: 2.5px solid #E0E7FF;
            border-radius: 16px; text-align: center;
            outline: none; transition: border-color 0.3s;
            background: #FAFBFF;
        }
        .name-card input:focus { border-color: var(--blue); }
        
        .mode-selector { margin: 20px 0; }
        .mode-selector label {
            display: block; font-size: 14px; color: var(--muted);
            margin-bottom: 12px; text-align: center;
        }
        .mode-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .mode-btn {
            padding: 10px 20px; border: 2px solid #E0E7FF;
            border-radius: 30px; background: white;
            font-size: 14px; cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: var(--purple); color: white; border-color: var(--purple);
        }
        
        .error-msg { color: var(--red); font-size: 13px; text-align: center; min-height: 20px; margin-top: 8px; }
        
        .btn {
            display: block; width: 100%; padding: 16px;
            font-size: 18px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .btn-pink { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; }
        .btn-teal { background: linear-gradient(135deg, var(--teal), var(--blue)); color: white; }
        .btn-yellow { background: linear-gradient(135deg, #FFE66D, #FF9F43); color: #2D3436; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        .home-stats {
            background: white; border-radius: 20px; padding: 20px;
            width: 100%; max-width: 360px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            position: relative; z-index: 1;
        }
        .home-stats h4 { font-size: 14px; color: var(--muted); margin-bottom: 12px; text-align: center; }
        .stat-row { display: flex; justify-content: space-around; }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 24px; font-weight: bold; color: var(--purple); }
        .stat-item .txt { font-size: 11px; color: var(--muted); }

        /* ===== 游戏页 ===== */
        #game {
            padding: 15px;
            gap: 10px;
        }
        .game-top {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .back-btn {
            background: white; border: none; padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .game-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            background: white; padding: 6px 14px; border-radius: 20px;
            font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .badge span { color: var(--muted); }
        .badge strong { color: var(--purple); }

        .game-layout {
            flex: 1; display: flex; flex-direction: column; gap: 15px;
        }
        .cards-layout {
            flex: 1;
            display: flex;
            gap: 15px;
            align-items: stretch;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .col-header {
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 12px;
        }
        .col-name .col-header { background: rgba(160,108,213,0.15); color: var(--purple); }
        .col-pct .col-header { background: rgba(78,205,196,0.15); color: var(--teal); }
        
        .match-card {
            flex: 1;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 56px;
            word-break: break-word;
            line-height: 1.3;
            position: relative;
            border: 3px solid transparent;
        }
        .col-name .match-card {
            background: white;
            box-shadow: 0 4px 15px rgba(160,108,213,0.1);
            color: var(--text);
            border-color: rgba(160,108,213,0.2);
        }
        .col-pct .match-card {
            background: white;
            box-shadow: 0 4px 15px rgba(78,205,196,0.1);
            color: var(--teal);
            border-color: rgba(78,205,196,0.2);
        }
        .match-card:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
        .match-card.selected { transform: scale(1.05); }
        .col-name .match-card.selected { border-color: var(--purple); background: rgba(160,108,213,0.1); }
        .col-pct .match-card.selected { border-color: var(--teal); background: rgba(78,205,196,0.1); }
        .match-card.matched {
            opacity: 0.4; cursor: default; transform: none !important;
        }
        .match-card.wrong { animation: shake 0.4s; border-color: var(--red) !important; }
        .match-card.correct { animation: pop 0.4s; border-color: var(--green) !important; background: rgba(38,222,129,0.1) !important; }
        
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}
        }
        @keyframes pop {
            0%{transform:scale(1)}
            50%{transform:scale(1.15)}
            100%{transform:scale(1)}
        }
        
        .col-name .match-card.correct { background: rgba(38,222,129,0.08) !important; border-color: var(--green) !important; color: var(--green); }
        .col-pct .match-card.correct { background: rgba(38,222,129,0.08) !important; border-color: var(--green) !important; color: var(--green); }
        
        .game-tip {
            text-align: center;
            padding: 12px;
            background: white;
            border-radius: 16px;
            font-size: 14px;
            color: var(--muted);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .game-tip strong { color: var(--purple); }
        
        .game-controls {
            display: flex; gap: 10px;
        }
        .game-controls .btn { padding: 12px; font-size: 15px; }

        /* ===== 结算页 ===== */
        #result {
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 20px;
            background: linear-gradient(135deg, #E8F0FF 0%, #FCE4EC 100%);
        }
        .result-title { font-size: 32px; text-align: center; }
        .result-title.win { color: var(--pink); }
        .result-title.fail { color: var(--muted); }
        
        .result-card {
            background: white; border-radius: 24px; padding: 25px;
            width: 100%; max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .result-card h3 { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 18px; }
        .result-stats { display: grid; gap: 12px; }
        .result-stat {
            display: flex; justify-content: space-between;
            padding: 10px 14px; background: var(--bg); border-radius: 12px;
        }
        .result-stat .label { color: var(--muted); font-size: 14px; }
        .result-stat .value { font-weight: bold; color: var(--purple); font-size: 16px; }
        
        .leaderboard { width: 100%; max-width: 380px; }
        .leaderboard h3 { font-size: 18px; text-align: center; margin-bottom: 12px; color: var(--text); }
        .lb-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .lb-tab { padding: 7px 18px; border: none; border-radius: 20px; background: #eee; cursor: pointer; font-size: 13px; }
        .lb-tab.active { background: var(--pink); color: white; }
        .lb-list { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .lb-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
        .lb-item:last-child { border-bottom: none; }
        .lb-rank { width: 28px; text-align: center; font-weight: bold; font-size: 16px; }
        .lb-rank.gold { color: #f1c40f; }
        .lb-rank.silver { color: #bdc3c7; }
        .lb-rank.bronze { color: #cd7f32; }
        .lb-name { flex: 1; font-size: 15px; color: var(--text); }
        .lb-score { font-size: 13px; color: var(--purple); font-weight: bold; }
        .lb-time { font-size: 11px; color: var(--muted); }
        
        .result-btns { display: flex; gap: 12px; width: 100%; max-width: 380px; }
        .result-btns .btn { flex: 1; padding: 14px; font-size: 15px; }
        
        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: white;
            padding: 10px 24px; border-radius: 30px;
            font-size: 14px; z-index: 1000;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-15px); } }
        
        /* 彩蛋 */
        .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        .confetti-piece { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        /* 答案复习弹窗 */
        .review-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .review-modal.show { display: flex; }
        .review-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            width: 100%; max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .review-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .review-header h3 { font-size: 18px; color: var(--purple); }
        .review-close {
            background: none; border: none; font-size: 24px;
            cursor: pointer; color: var(--muted); line-height: 1;
        }
        .review-list { display: grid; gap: 10px; }
        .review-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            background: #F8F9FF;
            border-radius: 14px;
            border-left: 4px solid var(--teal);
        }
        .review-item .idx {
            font-size: 12px; color: var(--muted);
            min-width: 24px;
        }
        .review-item .name {
            flex: 1; font-size: 14px; color: var(--text);
        }
        .review-item .arrow { color: var(--purple); font-size: 16px; }
        .review-item .pct {
            font-size: 15px; font-weight: bold; color: var(--teal);
            min-width: 44px; text-align: right;
        }
        .review-item.correct-item { border-left-color: var(--green); background: #F0FFF4; }
        .review-item.correct-item .pct { color: var(--green); }
        .review-item.wrong-item { border-left-color: var(--red); background: #FFF5F5; }
        .review-item.wrong-item .pct { color: var(--red); }
        .review-footer {
            margin-top: 16px;
            display: flex; gap: 10px;
        }
        .review-footer .btn { flex: 1; padding: 12px; font-size: 14px; }

        /* 进度条 */
        .progress-bar { width: 100%; height: 6px; background: #E0E7FF; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width 0.3s; border-radius: 3px; }
        .progress-wrap { background: white; border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        @media (max-width: 480px) {
            .match-card { font-size: 12px; min-height: 50px; padding: 6px; }
        }
    </style>
</head>
<body>

<!-- 首页 -->
<div id="home" class="page active">
    <div class="home-title">
        <span class="home-emoji">📊</span>
        <h1>TOB指标记忆挑战</h1>
        <p>将指标名称与权重百分比配对，训练你的考核记忆！</p>
    </div>
    <div class="name-card">
        <h3>👤 请输入你的名字</h3>
        <input type="text" id="nameInput" placeholder="名字（最多8字）" maxlength="8">
        <div class="error-msg" id="nameError"></div>
        <div class="mode-selector">
            <label>选择挑战难度</label>
            <div class="mode-btns">
                <button class="mode-btn active" data-mode="4" onclick="selectMode(4)">4对</button>
                <button class="mode-btn" data-mode="6" onclick="selectMode(6)">6对</button>
                <button class="mode-btn" data-mode="9" onclick="selectMode(9)">9对</button>
                <button class="mode-btn" data-mode="all" onclick="selectMode('all')">全部</button>
            </div>
        </div>
        <button class="btn btn-pink" onclick="startGame()">🎮 开始挑战</button>
        <button class="btn btn-yellow" onclick="showHomeReview()">📖 预习全部答案</button>
    </div>
    <div class="home-stats">
        <h4>📈 历史成绩</h4>
        <div class="stat-row">
            <div class="stat-item"><div class="num" id="statGames">0</div><div class="txt">总场次</div></div>
            <div class="stat-item"><div class="num" id="statBest">-</div><div class="txt">最佳用时</div></div>
            <div class="stat-item"><div class="num" id="statAcc">0%</div><div class="txt">平均正确率</div></div>
        </div>
    </div>
</div>

<!-- 游戏页 -->
<div id="game" class="page">
    <div class="game-top">
        <button class="back-btn" onclick="goHome()">← 返回</button>
        <div class="game-badges">
            <div class="badge"><span>⏱️</span> <strong id="timer">00:00</strong></div>
            <div class="badge"><span>✅</span> <strong id="correctCount">0</strong>/<span id="totalCount">0</span></div>
            <div class="badge"><span>🔄</span> <strong id="roundNum">1</strong></div>
        </div>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
    </div>
    <div class="game-layout">
        <div class="cards-layout">
            <div class="col col-name">
                <div class="col-header">📋 指标名称</div>
                <div id="nameCards"></div>
            </div>
            <div class="col col-pct">
                <div class="col-header">💯 权重百分比</div>
                <div id="pctCards"></div>
            </div>
        </div>
        <div class="game-tip" id="gameTip">👆 点击左侧指标，再点击右侧对应百分比配对</div>
        <div class="game-controls">
            <button class="btn btn-teal" onclick="resetRound()">🔄 重置本轮</button>
            <button class="btn btn-pink" onclick="giveUp()">🏳️ 放弃挑战</button>
        </div>
    </div>
</div>

<!-- 结算页 -->
<div id="result" class="page">
    <div class="result-title win" id="resultTitle">🎉 太棒了！</div>
    <div class="result-card">
        <h3>本次成绩</h3>
        <div class="result-stats">
            <div class="result-stat"><span class="label">姓名</span><span class="value" id="rName">-</span></div>
            <div class="result-stat"><span class="label">配对数</span><span class="value" id="rPairs">-</span></div>
            <div class="result-stat"><span class="label">正确率</span><span class="value" id="rAcc">-</span></div>
            <div class="result-stat"><span class="label">总用时</span><span class="value" id="rTime">-</span></div>
            <div class="result-stat"><span class="label">尝试次数</span><span class="value" id="rAttempts">-</span></div>
        </div>
    </div>
    <div class="leaderboard">
        <h3>🏆 排行榜 TOP10</h3>
        <div class="lb-tabs">
            <button class="lb-tab active" onclick="switchLB('today')">今日</button>
            <button class="lb-tab" onclick="switchLB('week')">本周</button>
            <button class="lb-tab" onclick="switchLB('all')">全部</button>
        </div>
        <div class="lb-list" id="lbList"></div>
    </div>
    <div class="result-btns">
        <button class="btn btn-pink" onclick="replay()">🔄 再来一局</button>
        <button class="btn btn-teal" onclick="goHome()">🏠 返回首页</button>
        <button class="btn" style="background:linear-gradient(135deg,#FFE66D,#FF9F43);color:#2D3436;" onclick="showReview()">📖 查看答案</button>
    </div>
</div>

<!-- 答案复习弹窗 -->
<div class="review-modal" id="reviewModal">
    <div class="review-content">
        <div class="review-header">
            <h3>📖 标准答案</h3>
            <button class="review-close" onclick="closeReview()">×</button>
        </div>
        <div class="review-list" id="reviewList"></div>
        <div class="review-footer">
            <button class="btn btn-teal" onclick="closeReview()">← 返回成绩</button>
            <button class="btn btn-pink" onclick="closeReview();replay();">🔄 再来一局</button>
        </div>
    </div>
</div>

<script>
// ===== 指标数据 =====
const ALL_DATA = [
    { name: '大件收派定损损坏', pct: '10%' },
    { name: '循环包装使用率', pct: '5%' },
    { name: '大件网点违规率', pct: '10%' },
    { name: '大件20kg+子母件分离率', pct: '3%' },
    { name: '首环节打托&建笼集装率', pct: '7%' },
    { name: '收派车辆升级', pct: '5%' },
    { name: '车辆配套', pct: '5%' },
    { name: '工业区揽收模式', pct: '10%' },
    { name: '入仓入厂', pct: '5%' },
    { name: '夜收夜派', pct: '5%' },
    { name: '签单返还不规范客诉', pct: '5%' },
    { name: '签单返还前端销售审单合规率', pct: '5%' },
    { name: '破损拦截试派', pct: '5%' },
    { name: '收派件拍照不规范', pct: '5%' },
    { name: '子母件到齐派送', pct: '5%' },
    { name: '培训执行及有效性', pct: '2.5%' },
    { name: '工单协查及时', pct: '2.5%' },
    { name: '奖罚落地（损坏细化、违规细化）', pct: '5%' },
];

// ===== 游戏状态 =====
const state = {
    playerName: '',
    mode: 4, // 配对数量
    data: [],
    nameCards: [],  // 打乱的指标
    pctCards: [],   // 打乱的百分比
    selectedName: null,
    selectedPct: null,
    matched: [],
    correct: 0,
    attempts: 0,
    timer: 0,
    timerInterval: null,
    round: 1,
    roundData: [],
};

// ===== 工具 =====
function $(id) { return document.getElementById(id); }
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(id).classList.add('active');
}
function fmt(s) {
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const ss = (s%60).toString().padStart(2,'0');
    return `${m}:${ss}`;
}
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}
function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}
function confetti() {
    const c = document.createElement('div'); c.className = 'confetti';
    const colors = ['#FF6B9D','#4ECDC4','#FFE66D','#A06CD5','#74B9FF','#FF9F43','#26DE81'];
    for (let i = 0; i < 60; i++) {
        const p = document.createElement('div'); p.className = 'confetti-piece';
        p.style.left = Math.random()*100+'%'; p.style.top = '-20px';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.borderRadius = Math.random()>0.5?'50%':'0';
        p.style.animationDuration = (1.5+Math.random()*2)+'s';
        p.style.animationDelay = Math.random()*0.5+'s';
        c.appendChild(p);
    }
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
}

// ===== 首页 =====
function selectMode(m) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.mode-btn[data-mode="${m}"]`).classList.add('active');
    state.mode = m;
}
function loadHomeStats() {
    const records = getRecords();
    $('statGames').textContent = records.length;
    if (records.length > 0) {
        const best = Math.min(...records.map(r => r.time));
        $('statBest').textContent = fmt(best);
        const avgAcc = Math.round(records.reduce((s,r) => s+r.acc, 0) / records.length);
        $('statAcc').textContent = avgAcc + '%';
    }
}
function startGame() {
    const name = $('nameInput').value.trim();
    if (!name) { $('nameError').textContent = '请输入名字哦~'; return; }
    $('nameError').textContent = '';
    state.playerName = name;
    state.round = 1;
    state.correct = 0;
    state.attempts = 0;
    state.timer = 0;
    state.matched = [];
    state.selectedName = null;
    state.selectedPct = null;
    
    // 准备数据
    const shuffled = shuffle([...ALL_DATA]);
    const count = state.mode === 'all' ? ALL_DATA.length : state.mode;
    state.data = shuffled.slice(0, count);
    state.nameCards = shuffle([...state.data]);
    state.pctCards = shuffle([...state.data]);
    
    renderGame();
    showPage('game');
    startTimer();
    $('roundNum').textContent = state.round;
    $('correctCount').textContent = '0';
    $('totalCount').textContent = count;
    $('progressBar').style.width = '0%';
}
function renderGame() {
    $('nameCards').innerHTML = state.nameCards.map((d,i) => `
        <div class="match-card" data-type="name" data-index="${i}" onclick="cardClick(this,'name',${i})">
            ${d.name}
        </div>`).join('');
    $('pctCards').innerHTML = state.pctCards.map((d,i) => `
        <div class="match-card" data-type="pct" data-index="${i}" onclick="cardClick(this,'pct',${i})">
            ${d.pct}
        </div>`).join('');
    $('gameTip').innerHTML = '👆 点击左侧指标，再点击右侧对应百分比配对';
}
function cardClick(el, type, idx) {
    if (el.classList.contains('matched')) return;
    
    // 清除同类之前的选中
    document.querySelectorAll(`.match-card[data-type="${type}"]`).forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    
    if (type === 'name') {
        state.selectedName = { el, idx, data: state.nameCards[idx] };
        state.selectedPct = null;
    } else {
        state.selectedPct = { el, idx, data: state.pctCards[idx] };
        // 如果左边已选，检查匹配
        if (state.selectedName) {
            checkMatch();
        }
    }
}
function checkMatch() {
    state.attempts++;
    const nameData = state.selectedName.data;
    const pctData = state.selectedPct.data;
    
    if (nameData.name === pctData.name && nameData.pct === pctData.pct) {
        // ✅ 正确
        state.correct++;
        state.matched.push(nameData.name);
        state.selectedName.el.classList.remove('selected');
        state.selectedName.el.classList.add('correct','matched');
        state.selectedPct.el.classList.remove('selected');
        state.selectedPct.el.classList.add('correct','matched');
        $('correctCount').textContent = state.correct;
        $('progressBar').style.width = (state.correct / state.data.length * 100) + '%';
        toast('✅ 配对成功！');
        
        if (state.correct === state.data.length) {
            // 全部完成
            setTimeout(() => {
                stopTimer();
                saveRecord();
                showResult(true);
            }, 800);
        }
    } else {
        // ❌ 错误
        state.selectedName.el.classList.add('wrong');
        state.selectedPct.el.classList.add('wrong');
        toast('❌ 不匹配！');
        setTimeout(() => {
            document.querySelectorAll('.wrong').forEach(c => {
                c.classList.remove('wrong','selected');
            });
        }, 600);
    }
    state.selectedName = null;
    state.selectedPct = null;
}
function resetRound() {
    state.selectedName = null;
    state.selectedPct = null;
    state.matched = [];
    state.nameCards = shuffle([...state.data]);
    state.pctCards = shuffle([...state.data]);
    renderGame();
}
function giveUp() {
    stopTimer();
    saveRecord();
    showResult(false);
}
function showResult(won) {
    $('resultTitle').textContent = won ? '🎉 太棒了！' : '💪 继续加油！';
    $('resultTitle').className = 'result-title ' + (won ? 'win' : 'fail');
    $('rName').textContent = state.playerName;
    $('rPairs').textContent = `${state.correct}/${state.data.length}`;
    const acc = state.attempts > 0 ? Math.round(state.correct / state.attempts * 100) : 0;
    $('rAcc').textContent = acc + '%';
    $('rTime').textContent = fmt(state.timer);
    $('rAttempts').textContent = state.attempts;
    renderLeaderboard('today');
    showPage('result');
    if (won) confetti();
}
function replay() {
    state.round = 1;
    state.correct = 0;
    state.attempts = 0;
    state.timer = 0;
    state.matched = [];
    state.selectedName = null;
    state.selectedPct = null;
    state.nameCards = shuffle([...state.data]);
    state.pctCards = shuffle([...state.data]);
    renderGame();
    showPage('game');
    startTimer();
    $('roundNum').textContent = state.round;
    $('correctCount').textContent = '0';
    $('progressBar').style.width = '0%';
}
function goHome() {
    stopTimer();
    loadHomeStats();
    showPage('home');
}

// ===== 计时器 =====
function startTimer() {
    state.timer = 0;
    state.timerInterval = setInterval(() => {
        state.timer++;
        $('timer').textContent = fmt(state.timer);
    }, 1000);
}
function stopTimer() {
    clearInterval(state.timerInterval);
}

// ===== 记录 =====
function getRecords() {
    try { return JSON.parse(localStorage.getItem('tob_records') || '[]'); }
    catch { return []; }
}
function saveRecord() {
    const records = getRecords();
    const today = new Date().toISOString().split('T')[0];
    const weekStart = getWeekStart();
    const acc = state.attempts > 0 ? Math.round(state.correct / state.attempts * 100) : 0;
    records.push({
        name: state.playerName,
        pairs: state.data.length,
        correct: state.correct,
        acc,
        time: state.timer,
        attempts: state.attempts,
        date: today,
        weekStart,
        ts: Date.now()
    });
    if (records.length > 500) records.splice(0, records.length - 500);
    localStorage.setItem('tob_records', JSON.stringify(records));
}
function getWeekStart() {
    const d = new Date();
    const day = d.getDay() || 7;
    d.setDate(d.getDate() - day + 1);
    return d.toISOString().split('T')[0];
}
function renderLeaderboard(type) {
    const records = getRecords();
    const today = new Date().toISOString().split('T')[0];
    const weekStart = getWeekStart();
    const filtered = records.filter(r => {
        if (type === 'today') return r.date === today;
        if (type === 'week') return r.weekStart === weekStart;
        return true;
    });
    filtered.sort((a,b) => {
        if (b.correct !== a.correct) return b.correct - a.correct;
        if (b.acc !== a.acc) return b.acc - a.acc;
        return a.time - b.time;
    });
    const top = filtered.slice(0, 10);
    const list = $('lbList');
    if (top.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">暂无记录，开始你的第一次挑战吧！</div>';
        return;
    }
    list.innerHTML = top.map((r,i) => {
        const rc = i===0?'gold':i===1?'silver':i===2?'bronze':'';
        const ri = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
        return `<div class="lb-item">
            <div class="lb-rank ${rc}">${ri}</div>
            <div>
                <div class="lb-name">${r.name}</div>
                <div class="lb-time">${r.pairs}对 · ${r.acc}%正确率</div>
            </div>
            <div class="lb-score">${fmt(r.time)}</div>
        </div>`;
    }).join('');
}
function switchLB(type) {
    document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderLeaderboard(type);
}

// ===== 复习答案 =====
function showReview() {
    const matched = new Set(state.matched);
    const list = $('reviewList');
    list.innerHTML = state.data.map((d, i) => {
        const isCorrect = matched.has(d.name);
        const cls = isCorrect ? 'correct-item' : 'wrong-item';
        const icon = isCorrect ? '✅' : '❌';
        return `<div class="review-item ${cls}">
            <span class="idx">${i+1}</span>
            <span class="name">${d.name}</span>
            <span class="arrow">→</span>
            <span class="pct">${d.pct} ${icon}</span>
        </div>`;
    }).join('');
    $('reviewModal').classList.add('show');
}
// ===== 首页预习答案 =====
function showHomeReview() {
    const list = $('reviewList');
    list.innerHTML = ALL_DATA.map((d, i) => {
        return `<div class="review-item">
            <span class="idx">${i+1}</span>
            <span class="name">${d.name}</span>
            <span class="arrow">→</span>
            <span class="pct">${d.pct}</span>
        </div>`;
    }).join('');
    // 隐藏底部按钮（首页复习不需要再玩）
    $('reviewModal').classList.add('show');
}
function closeReview() {
    $('reviewModal').classList.remove('show');
}
// 点击背景关闭
$('reviewModal').addEventListener('click', function(e) {
    if (e.target === this) closeReview();
});

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
    loadHomeStats();
});
</script>
</body>
</html>
